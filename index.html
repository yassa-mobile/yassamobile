    <script>
      // Pasang penerima pesan "pindah tab" dari Hub SEDINI mungkin (sebelum React tampil),
      // supaya permintaan tab KK dari Hub tidak terlewat dan layar tidak sempat mampir ke Beranda.
      (function () {
        try {
          var emb = new URLSearchParams(window.location.search).get("embed") === "1";
          if (!emb) return;
          window.__yassaHubTab = null;
          window.addEventListener("message", function (e) {
            var d = e.data;
            if (e.source !== window.parent || window.__yassaReactMounted) return;
            if (
              d &&
              d.type === "YASSA_HUB_NAVIGATE" &&
              ["home", "keluarga", "perisai", "anak", "aksi"].indexOf(d.tab) !== -1
            ) {
              window.__yassaHubTab = d.tab;
              try {
                if (d.nonce && e.source) {
                  e.source.postMessage({ type: "YASSA_HUB_NAV_ACK", nonce: d.nonce }, e.origin);
                }
              } catch (_) {}
            }
          });
        } catch (_) {}
      })();
    </script>

<script id="yassa-cetak-rekap">
/* 🖨️ Cetak rekap Beranda: membuat dokumen sendiri (kop YASSA + satu tabel) di jendela baru,
   jadi tidak bergantung pada CSS cetak halaman utama. */
window.yassaCetakRekap = function (o) {
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  var al = function (i) { return i === 0 ? 'text-align:left' : 'text-align:right'; };
  var head = '<tr>' + o.kolom.map(function (k, i) { return '<th style="' + al(i) + '">' + esc(k) + '</th>'; }).join('') + '</tr>';
  var body = (o.baris || []).map(function (r, ri) {
    var bold = (o.tebal || []).indexOf(ri) > -1, bg = (o.warna || {})[ri];
    return '<tr' + (bold ? ' class="b"' : '') + (bg ? ' style="background:' + bg + '"' : '') + '>' +
      r.map(function (c, i) { return '<td style="' + al(i) + '">' + esc(c) + '</td>'; }).join('') + '</tr>';
  }).join('');
  var css = '@page{size:A4 portrait;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;font-size:11pt;margin:0}' +
    '.kop{text-align:center}.kop h1{font-size:17pt;letter-spacing:1px;margin:0 0 3px;font-weight:900}.kop p{margin:0;font-size:8.5pt;font-weight:700}' +
    '.r1{border-top:1.5px solid #0f172a;margin:8px 0 2px}.r2{border-top:3px solid #0f172a;margin:0 0 12px}' +
    'h2{font-size:13pt;margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}.info{font-size:9.5pt;color:#334155;margin:0 0 12px}' +
    'table{width:100%;border-collapse:collapse;font-size:10.5pt}th,td{border:1px solid #334155;padding:5px 8px}' +
    'th{background:#e2e8f0;-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}' +
    '.b td{font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.cat{font-size:9pt;color:#475569;margin-top:10px}.ft{margin-top:14px;font-size:8.5pt;color:#64748b}';
  var html = '<!doctype html><html lang="id"><head><meta charset="utf-8"><title>' + esc(o.judul) + '</title><style>' + css + '</style></head><body>' +
    '<div class="kop"><h1>YAYASAN SALAM SATU ASPAL</h1>' +
    '<p>Jalan H. Mean Raya No. 72 RT 001 RW 002 Kelurahan Karang Timur Kecamatan Karang Tengah Kota Tangerang Provinsi Banten 15157 · 081385009062</p>' +
    '<p>Email: info@yayasansalamsatuaspal.com | Website: yayasansalamsatuaspal.com</p></div><div class="r1"></div><div class="r2"></div>' +
    '<h2>' + esc(o.judul) + '</h2><p class="info">' + esc(o.info || '') + '</p>' +
    '<table>' + head + body + '</table>' +
    (o.catatan ? '<p class="cat">' + esc(o.catatan) + '</p>' : '') +
    '<p class="ft">Dicetak: ' + tgl + ' · YASSA Mobile</p>' +
    '<script>window.onload=function(){setTimeout(function(){window.focus();window.print()},350)}<\/script></body></html>';
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) {}
  if (w) { w.document.open(); w.document.write(html); w.document.close(); return; }
  /* cadangan bila pop-up diblokir: cetak lewat iframe tersembunyi */
  var f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
  setTimeout(function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { alert('Cetak gagal. Izinkan pop-up untuk situs ini lalu coba lagi.'); } setTimeout(function () { document.body.removeChild(f); }, 4000); }, 400);
};
</script>

    <!-- BANNER STATUS JARINGAN -->
    <div id="networkStatusBanner" class="network-status-banner offline">
      <span>📡</span>
      <span id="networkStatusText">Koneksi internet terputus</span>
    </div>
    <script>
      (function () {
        var onlineToastTimer = null;
        function updateNetworkStatusBanner(isOnline) {
          var banner = document.getElementById("networkStatusBanner");
          var textEl = document.getElementById("networkStatusText");
          if (!banner || !textEl) return;
          if (onlineToastTimer) {
            clearTimeout(onlineToastTimer);
            onlineToastTimer = null;
          }
          if (!isOnline) {
            banner.classList.remove("online");
            banner.classList.add("offline", "show");
            textEl.textContent = "Koneksi internet terputus";
            return;
          }
          if (banner.classList.contains("show")) {
            banner.classList.remove("offline");
            banner.classList.add("online");
            textEl.textContent = "Koneksi internet kembali tersambung";
            onlineToastTimer = setTimeout(function () {
              banner.classList.remove("show");
            }, 2500);
          }
        }
        window.addEventListener("online", function () { updateNetworkStatusBanner(true); });
        window.addEventListener("offline", function () { updateNetworkStatusBanner(false); });
        if (!navigator.onLine) updateNetworkStatusBanner(false);
      })();
    </script>

    <!-- PWA Service Worker + Auto-Update -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("service-worker.js")
            .then(function (reg) {
              reg.addEventListener("updatefound", function () {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener("statechange", function () {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    newWorker.postMessage("SKIP_WAITING");
                  }
                });
              });
            })
            .catch(function () {});

          var refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>

      try {

          authDomain: "yassamobile-1e4d2998.firebaseapp.com",
          projectId: "yassamobile-1e4d2998",
          storageBucket: "yassamobile-1e4d2998.firebasestorage.app",
          messagingSenderId: "1071864272227",
          appId: "1:1071864272227:web:78b1354aa825b713d36f56"
        };
        if (window.firebase && !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const messaging = window.firebase ? firebase.messaging() : null;

        const NOTIF_DEV_ID = (function () {
          try {
            var d = new URLSearchParams(window.location.search).get("dev") || "";
            return /^[A-Za-z0-9_-]{16,64}$/.test(d) ? d : "";
          } catch (e) {
            return "";
          }
        })();

        function notifyHubNotifStatus(status) {
          try { window.__notifOnlyResult = status; } catch (e) {}
          try {
            if (NOTIF_DEV_ID) {
              fetch(
                YASSA_FCM_CONFIG.GAS_URL +
                  "?action=reportNotifStatus&dev=" +
                  encodeURIComponent(NOTIF_DEV_ID) +
                  "&status=" +
                  encodeURIComponent(status) +
                  "&ts=" +
                  Date.now(),
                { method: "GET", mode: "no-cors", keepalive: true }
              );
            }
          } catch (e) {}
          try {
            if (window.opener) {
              window.opener.postMessage({ type: "yassa-mobile-notif-status", status: status }, "*");
            }
          } catch (e) {}
          try {
            if (typeof window.__yassaNotifOnlyMarkProcessing === "function") {
              window.__yassaNotifOnlyMarkProcessing();
            }
          } catch (e) {}
        }

        async function subscribeToTopic(token, usernameParam) {
          try {
            const username =
              usernameParam ||
              (window.yassaStore ? window.yassaStore.get("yassa-username") : null) ||
              localStorage.getItem("yassa-username") ||
              "unknown";
            const sessionToken =
              (window.yassaStore ? window.yassaStore.get("yassa-token") : null) ||
              localStorage.getItem("yassa-token") ||
              "";
            const params = new URLSearchParams({
              action: "subscribeToken",
              token: token,
              username: username,
              sessionToken: sessionToken,
              ts: String(Date.now())
            });
            await fetch(YASSA_FCM_CONFIG.GAS_URL + "?" + params.toString(), {
              method: "GET",
              mode: "no-cors"
            });
          } catch (e) {}
        }

        window.initPushNotification = async function (usernameParam) {
          try {
            if (!messaging) return;
            const permission = await Notification.requestPermission();
            if (permission !== "granted") {
              notifyHubNotifStatus(permission);
              return;
            }
            notifyHubNotifStatus("granted");
            const token = await messaging.getToken({
              vapidKey: YASSA_FCM_CONFIG.FCM_VAPID,
              serviceWorkerRegistration: await navigator.serviceWorker.ready
            });
            if (token) {
              await subscribeToTopic(token, usernameParam);
            }
          } catch (err) {}
        };

        if (messaging) {
          messaging.onMessage(function (payload) {
            try {
              var notif = payload && payload.notification ? payload.notification : {};
              if (Notification.permission === "granted" && "serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then(function (reg) {
                  reg.showNotification(notif.title || "YASSA Mobile", {

                  });
                });
              }
            } catch (e) {}
          });
        }
      } catch (e) {}
