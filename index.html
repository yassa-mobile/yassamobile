    <script>
      // Pasang penerima pesan "pindah tab" dari Hub SEDINI mungkin (sebelum React tampil)
      (function () {
        try {
          var emb = new URLSearchParams(window.location.search).get("embed") === "1";
          if (!emb) return;
          window.__yassaHubTab = null;
          window.addEventListener("message", function (e) {
            var d = e.data;
            if (e.source !== window.parent || window.__yassaReactMounted) return;
            if (d && d.type === "YASSA_HUB_NAVIGATE" && ["home", "keluarga", "perisai", "anak", "aksi"].indexOf(d.tab) !== -1) {
              window.__yassaHubTab = d.tab;
              try {
                if (d.nonce && e.source) e.source.postMessage({ type: "YASSA_HUB_NAV_ACK", nonce: d.nonce }, e.origin);
              } catch (_) {}
            }
          });
        } catch (_) {}
      })();
    </script>

  <body class="overflow-hidden bg-[#F4F6F8] dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 antialiased">
    <!-- BANNER STATUS JARINGAN -->
    <div id="networkStatusBanner" class="network-status-banner offline">
      <span>📡</span>
      <span id="networkStatusText">Koneksi internet terputus</span>
    </div>
    <script>
      (function () {
        var onlineToastTimer = null;
        function updateNetworkStatusBanner(isOnline) {
          var banner = document.getElementById("networkStatusBanner");
          var textEl = document.getElementById("networkStatusText");
          if (!banner || !textEl) return;
          if (onlineToastTimer) {
            clearTimeout(onlineToastTimer);
            onlineToastTimer = null;
          }
          if (!isOnline) {
            banner.classList.remove("online");
            banner.classList.add("offline", "show");
            textEl.textContent = "Koneksi internet terputus";
            return;
          }
          if (banner.classList.contains("show")) {
            banner.classList.remove("offline");
            banner.classList.add("online");
            textEl.textContent = "Koneksi internet kembali tersambung";
            onlineToastTimer = setTimeout(function () {
              banner.classList.remove("show");
            }, 2500);
          }
        }
        window.addEventListener("online", function () { updateNetworkStatusBanner(true); });
        window.addEventListener("offline", function () { updateNetworkStatusBanner(false); });
        if (!navigator.onLine) updateNetworkStatusBanner(false);
      })();
    </script>

    <div id="root">
      <div style="position:fixed; inset:0; background-color:#0B1120; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; font-family:'Plus Jakarta Sans', sans-serif;">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:2rem;">
          <h1 style="font-size:2.25rem; font-weight:800; letter-spacing:-0.03em; color:#ffffff; margin:0;">
            YASSA<span style="color:#22c55e;">Mobile</span>
          </h1>
        </div>
        <div style="width:12rem; height:5px; background-color:#1e293b; border-radius:9999px; overflow:hidden; margin-bottom:1.25rem; position:relative;">
          <div style="position:absolute; top:0; left:0; height:100%; width:50%; background:linear-gradient(to right, #34d399, #22c55e, #059669); border-radius:9999px; animation:yassaLoadingBar 1.2s ease-in-out infinite;"></div>
        </div>
        <p style="color:#94a3b8; font-size:12px; font-weight:500; margin:0;">Menyiapkan data — demi mereka yang menunggu...</p>
      </div>
      <style>
        @keyframes yassaLoadingBar {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(100%); }
          100% { transform: translateX(-100%); }
        }
      </style>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker + Auto-Update -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("service-worker.js")
            .then(function (reg) {
              reg.addEventListener("updatefound", function () {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener("statechange", function () {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    newWorker.postMessage("SKIP_WAITING");
                  }
                });
              });
            })
            .catch(function () {});

          var refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>

    <!-- FIREBASE CLOUD MESSAGING - YASSA Mobile Push Notification -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
    <script>
      try {
        var firebaseConfig = {
          apiKey: "AIzaSyAKMECZeKWpbYz5fB_1dWNAaa5uiqoUwIU",
          authDomain: "yassamobile-1e4d2998.firebaseapp.com",
          projectId: "yassamobile-1e4d2998",
          storageBucket: "yassamobile-1e4d2998.firebasestorage.app",
          messagingSenderId: "1071864272227",
          appId: "1:1071864272227:web:78b1354aa825b713d36f56"
        };
        if (window.firebase && !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        var messaging = window.firebase ? firebase.messaging() : null;

        var NOTIF_DEV_ID = (function () {
          try {
            var d = new URLSearchParams(window.location.search).get("dev") || "";
            return /^[A-Za-z0-9_-]{16,64}$/.test(d) ? d : "";
          } catch (e) {
            return "";
          }
        })();

        function notifyHubNotifStatus(status) {
          try { window.__notifOnlyResult = status; } catch (e) {}
          try {
            if (NOTIF_DEV_ID) {
              var gasUrlLapor = typeof window.YASSA_CONFIG !== "undefined" && window.YASSA_CONFIG.GAS_URL ? window.YASSA_CONFIG.GAS_URL : "";
              if (gasUrlLapor) {
                fetch(gasUrlLapor + "?action=reportNotifStatus&dev=" + encodeURIComponent(NOTIF_DEV_ID) + "&status=" + encodeURIComponent(status) + "&ts=" + Date.now(), {
                  method: "GET",
                  mode: "no-cors",
                  keepalive: true
                });
              }
            }
          } catch (e) {}
          try {
            if (window.opener) {
              window.opener.postMessage({ type: "yassa-mobile-notif-status", status: status }, "*");
            }
          } catch (e) {}
          try {
            if (typeof window.__yassaNotifOnlyMarkProcessing === "function") {
              window.__yassaNotifOnlyMarkProcessing();
            }
          } catch (e) {}
        }

        async function initPushNotification(usernameParam) {
          try {
            if (!messaging) return;
            var permission = await Notification.requestPermission();
            if (permission !== "granted") {
              notifyHubNotifStatus(permission);
              return;
            }
            notifyHubNotifStatus("granted");
            var vapid = typeof window.YASSA_CONFIG !== "undefined" ? window.YASSA_CONFIG.FCM_VAPID : "BHIK0YI29D_A7VoUrVQ7kSbCe7BpGbYIvvZn0KX50a2CXWAfNubkRQlhKK3jDMOsKFYUL7mHKoQDh2XtsanW6KA";
            var token = await messaging.getToken({
              vapidKey: vapid,
              serviceWorkerRegistration: await navigator.serviceWorker.ready
            });
            if (token) {
              await subscribeToTopic(token, usernameParam);
            }
          } catch (err) {
            console.error("[FCM] Subscribe token gagal (izin tetap granted):", err);
          }
        }

        async function subscribeToTopic(token, usernameParam) {
          try {
            var username =
              usernameParam ||
              (typeof window.yassaStore !== "undefined" ? window.yassaStore.get("yassa-username") : null) ||
              localStorage.getItem("yassa-username") ||
              "unknown";
            var sessionToken =
              (typeof window.yassaStore !== "undefined" ? window.yassaStore.get("yassa-token") : null) ||
              localStorage.getItem("yassa-token") ||
              "";
            var gasUrl = typeof window.YASSA_CONFIG !== "undefined" ? window.YASSA_CONFIG.GAS_URL : "";
            var params = new URLSearchParams({ action: "subscribeToken", token: token, username: username, sessionToken: sessionToken, ts: Date.now() });
            await fetch(gasUrl + "?" + params.toString(), { method: "GET", mode: "no-cors" });
          } catch (e) {
            console.error("[FCM] Gagal subscribe:", e);
          }
        }

        window.initPushNotification = initPushNotification;

        if (messaging) {
          messaging.onMessage(function (payload) {
            try {
              var notif = payload.notification || {};
              if (Notification.permission === "granted" && "serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then(function (reg) {
                  reg.showNotification(notif.title || "YASSA Mobile", {
                    body: notif.body || "",
                    icon: "/yassamobile/icon-192.png",
                    badge: "/yassamobile/icon-192.png",
                    vibrate: [200, 100, 200]
                  });
                });
              }
            } catch (error) {}
          });
        }
      } catch (e) {}
    </script>
