<script>
// ============================================================
// LOGIKA PERHITUNGAN SANTUNAN YASSA (MODULAR)
// ============================================================
const hitungTotalSantunanGopay = (anakList, baseNom, bonusNom) => {
    const base = parseInt(baseNom || 0);
    const bonus = parseInt(bonusNom || 0);
    
    if (base === 0 || !anakList || anakList.length === 0) return 0;

    let totalYP = 0;
    let totalDsb = 0;

    anakList.forEach(c => {
        const yp = String(getVal(c, 'YATIM PIATU') || '').toUpperCase();
        const dsb = String(getVal(c, 'DISABILITAS') || '').toUpperCase();

        if (yp.includes('PIATU') || yp === 'YA') totalYP++;
        if (dsb.includes('DISABILITAS') || dsb === 'YA') totalDsb++;
    });

    return (anakList.length * base) + ((totalYP + totalDsb) * bonus);
};

// Fungsi pembersih ID Keluarga
const normId = (id) => String(id || "").toUpperCase().replace(/[^A-Z0-9]/g, "").trim();

// ============================================================
// 🔒 MASKING NOMOR REKENING UNTUK LAPORAN DONATUR
// Hanya menampilkan 4 digit/karakter pertama, sisanya disamarkan
// dengan tanda bintang (*) demi menjaga privasi penerima manfaat.
// Contoh: 1234567890  ->  1234******
// ============================================================
const maskRekeningDonatur = (rekeningRaw) => {
    const bersih = String(rekeningRaw || '').trim();
    if (!bersih || bersih === '-' || bersih.toUpperCase() === 'NA' || bersih.toUpperCase() === 'N/A') return '-';
    if (bersih.length <= 4) return '*'.repeat(bersih.length); // terlalu pendek, samarkan semua demi keamanan
    return bersih.slice(0, 4) + '*'.repeat(bersih.length - 4);
};

// ============================================================
// 🔒 MASKING ATAS NAMA / PEMILIK REKENING UNTUK LAPORAN DONATUR
// Kata pertama (nama depan) tetap terlihat sebagai penanda,
// kata-kata berikutnya disamarkan penuh dengan tanda bintang (*)
// demi menjaga privasi penerima manfaat.
// Contoh: "SITI AMINAH"  ->  "SITI ******"
// ============================================================
const maskNamaPemilik = (namaRaw) => {
    const bersih = String(namaRaw || '').trim();
    if (!bersih || bersih === '-' || bersih.toUpperCase() === 'NA' || bersih.toUpperCase() === 'N/A') return '-';
    const kata = bersih.split(/\s+/);
    if (kata.length === 1) {
        // Satu kata saja: tampilkan huruf pertama, sisanya disamarkan
        return kata[0].length <= 2 ? '*'.repeat(kata[0].length) : kata[0][0] + '*'.repeat(kata[0].length - 1);
    }
    return [kata[0], ...kata.slice(1).map(k => '*'.repeat(k.length))].join(' ');
};

// ============================================================
// 🔒 MASKING TANGGAL LAHIR UNTUK CETAK KATALOG ANAK
// Tanggal (hari) disembunyikan jadi "xx", bulan & tahun tetap
// tampil demi menjaga privasi identitas anak.
// Data mentah dari sheet berformat yyyy-MM-dd, hasil masking
// ditampilkan dalam format Indonesia (dd-MM-yyyy).
// Contoh: 2024-06-15  ->  xx-06-2024
// ============================================================
const maskTanggalLahirKatalog = (tglRaw) => {
    const bersih = String(tglRaw || '').trim();
    if (!bersih || bersih === '-') return '-';
    const bagian = bersih.split(/[-\/]/).filter(Boolean);
    if (bagian.length === 3) {
        // Format yyyy-MM-dd (bagian pertama 4 digit = tahun)
        if (bagian[0].length === 4) return `xx-${bagian[1]}-${bagian[0]}`;
        // Format dd-MM-yyyy (bagian terakhir 4 digit = tahun)
        if (bagian[2].length === 4) return `xx-${bagian[1]}-${bagian[2]}`;
    }
    return bersih; // format tak dikenali, tampilkan apa adanya
};

// ============================================================
// 🔒 MASKING ALAMAT UNTUK CETAK KATALOG ANAK
// Detail spesifik (nama jalan, no rumah, RT/RW) disamarkan,
// hanya area umum (kelurahan/kecamatan/kabupaten - biasanya
// segmen terakhir yang dipisah koma) yang tetap ditampilkan.
// Contoh: "Jl. Mawar No.12 RT03/RW05, Ds. Sukamaju, Kec. Cileungsi"
//         -> "•••, Ds. Sukamaju, Kec. Cileungsi"
// ============================================================
const maskAlamatKatalog = (alamatRaw) => {
    const bersih = String(alamatRaw || '').trim();
    if (!bersih || bersih === '-') return '-';
    const bagian = bersih.split(',').map(p => p.trim()).filter(Boolean);
    if (bagian.length > 1) {
        // Sensor segmen pertama (jalan/no rumah/RT-RW), sisakan 2 segmen terakhir (area umum)
        return `•••, ${bagian.slice(-2).join(', ')}`;
    }
    // Tanpa koma: sensor angka (no rumah/RT/RW), sisanya (nama area) tetap tampil
    return bersih.replace(/\d+/g, 'xx');
};

    <!-- ============ BANNER STATUS JARINGAN (di luar tree React) ============ -->
    <div id="networkStatusBanner" class="network-status-banner offline">
        <span>📡</span>
        <span id="networkStatusText">Koneksi internet terputus</span>
    </div>
    <script>
        // ============================================================
        // 🩹 FIX (poin 3: indikator status jaringan) -- sengaja pakai
        // blok script vanilla TERPISAH dari komponen React App() di bawah,
        // biar (1) jalan dari awal SEBELUM React sempat mount/render,
        // dan (2) gak perlu nambah state/re-render ke komponen App()
        // yang udah kompleks. navigator.onLine + event online/offline
        // adalah API bawaan browser, gak butuh library apapun.
        //
        // CATATAN JUJUR: navigator.onLine cuma baca status adaptor
        // jaringan device (ada sinyal/data aktif atau enggak), BUKAN
        // jaminan internetnya beneran nyambung ke server YASSA (mis.
        // WiFi nyala tanpa akses internet tetap kebaca "online"). Jadi
        // banner ini pelengkap -- kegagalan request tetap ditangani
        // terpisah oleh postApiWithRetry (lihat pesan error di layarnya
        // masing-masing).
        // ============================================================
        (function () {
            let onlineToastTimer = null;

            function updateNetworkStatusBanner(isOnline) {
                const banner = document.getElementById("networkStatusBanner");
                const textEl = document.getElementById("networkStatusText");
                if (!banner || !textEl) return;

                if (onlineToastTimer) {
                    clearTimeout(onlineToastTimer);
                    onlineToastTimer = null;
                }

                if (!isOnline) {
                    banner.classList.remove("online");
                    banner.classList.add("offline", "show");
                    textEl.textContent = "Koneksi internet terputus";
                    return;
                }

                // Baru balik online: kalau banner "offline" lagi keliatan,
                // ganti jadi "koneksi kembali" 2.5 detik dulu baru sembunyi.
                if (banner.classList.contains("show")) {
                    banner.classList.remove("offline");
                    banner.classList.add("online");
                    textEl.textContent = "Koneksi internet kembali tersambung";
                    onlineToastTimer = setTimeout(function () {
                        banner.classList.remove("show");
                    }, 2500);
                }
            }

            window.addEventListener("online", function () { updateNetworkStatusBanner(true); });
            window.addEventListener("offline", function () { updateNetworkStatusBanner(false); });
            // Cek status awal pas app baru dibuka (jaga-jaga kalau HP udah
            // dalam keadaan offline SEBELUM app ini dimuat).
            if (!navigator.onLine) updateNetworkStatusBanner(false);
        })();
    </script>

                                if (newWorker.state === 'installed') {
                                    if (navigator.serviceWorker.controller) {
                                        // Ada versi baru → kirim perintah skip waiting
                                        console.log('[SW] Versi baru siap, aktivasi...');
                                        newWorker.postMessage('SKIP_WAITING');

                    })
                    .catch(err => console.error('❌ SW gagal:', err));

                // Reload otomatis saat SW baru mengambil alih

                    if (!refreshing) {
                        refreshing = true;
                        console.log('[SW] Controller baru aktif, reload...');
                        window.location.reload();
                    }
                });
            });
        }

  // Hub, window.opener bakal terisi otomatis) soal status izin notifikasi.
  // Dipakai supaya tombol "Aktifkan Notifikasi" di Hub bisa tahu beneran
  // izinnya granted/denied, bukan cuma nebak dari localStorage sendiri.
  function notifyHubNotifStatus(status) {
    try {
      if (window.opener) {
        window.opener.postMessage({ type: 'yassa-mobile-notif-status', status: status }, '*');
      }
    } catch (e) {
      console.log('[FCM] Gagal lapor status ke Hub:', e);
    }
  }

  async function initPushNotification(usernameParam) {
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        notifyHubNotifStatus(permission); // 'denied' atau 'default'
        return;
      }

      // 🩹 FIX: lapor "granted" ke Hub SEGERA setelah izin browser di-Allow.
      // Gate di Hub cuma soal izin browser, bukan soal sukses/gagalnya
      // subscribe FCM ke server -- jangan sampai sinyal lemah / GAS cold
      // start bikin user nyangkut minta izin berulang-ulang padahal
      // izinnya sudah beneran granted.
      notifyHubNotifStatus('granted');

      const token = await messaging.getToken({
        vapidKey: (typeof YASSA_CONFIG !== 'undefined' ? YASSA_CONFIG.FCM_VAPID : 'BHIK0YI29D_A7VoUrVQ7kSbCe7BpGbYIvvZn0KX50a2CXWAfNubkRQlhKK3jDMOsKFYUL7mHKoQDh2XtsanW6KA'),
        serviceWorkerRegistration: await navigator.serviceWorker.ready
      });
      if (token) {
        console.log('[FCM] Token berhasil didapat ✅');
        await subscribeToTopic(token, usernameParam);
      } else {
        console.log('[FCM] getToken() tidak mengembalikan token');
      }
    } catch (err) {
      // Gagal di sini = gagal subscribe token ke server, BUKAN gagal izin.
      // Izin tetap granted, gate Hub tetap kebuka. Login normal berikutnya
      // akan otomatis coba subscribe ulang.
      console.error('[FCM] Subscribe token gagal (izin tetap granted):', err);
    }
  }

  async function subscribeToTopic(token, usernameParam) {
    try {
      const username = usernameParam
        || (typeof yassaStore !== 'undefined' ? yassaStore.get('yassa-username') : null)
        || localStorage.getItem('yassa-username')
        || 'unknown';
      // 🛡️ Sertakan session token login (bukan cuma username) supaya backend bisa
      // memverifikasi identitas sebelum mendaftarkan token FCM ini.
      const sessionToken = (typeof yassaStore !== 'undefined' ? yassaStore.get('yassa-token') : null)
        || localStorage.getItem('yassa-token')
        || '';
      const gasUrl = typeof YASSA_CONFIG !== 'undefined' ? YASSA_CONFIG.GAS_URL : '';
      const params = new URLSearchParams({ action: 'subscribeToken', token, username, sessionToken, ts: Date.now() });
      await fetch(gasUrl + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
      console.log('[FCM] Token dikirim ke GAS ✅');
    } catch (e) {
      console.error('[FCM] Gagal subscribe:', e);
    }
  }

  messaging.onMessage((payload) => {
    try {
      const { title, body } = payload.notification;
      if (Notification.permission === 'granted' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, {
            body,
            icon: '/yassamobile/icon-192.png',
            badge: '/yassamobile/icon-192.png',
            vibrate: [200, 100, 200]
          });
        });
      }
    } catch (error) {
      console.error('[FCM] Error foreground:', error);
    }
  });
</script>
