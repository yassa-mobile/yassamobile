<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Verifikasi Dokumen - Yayasan Salam Satu Aspal</title><style>body{margin:0;background:#f1f5f9;padding:8px}</style></head><body>
<!-- YASSA verifikasi dokumen --><div id="yassa-verif" style="max-width:520px;margin:24px auto;font-family:Arial,Helvetica,sans-serif;color:#0f172a"><style> #yassa-verif .kartu{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;box-shadow:0 2px 14px rgba(0,0,0,.07)} #yassa-verif h2{margin:0 0 2px;font-size:20px} #yassa-verif .sub{font-size:12px;color:#64748b;margin-bottom:16px} #yassa-verif .badge{padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-bottom:14px;line-height:1.4} #yassa-verif .badge small{display:block;font-weight:400;font-size:12.5px;margin-top:4px} #yassa-verif .hijau{background:#dcfce7;color:#166534} #yassa-verif .merah{background:#fee2e2;color:#991b1b} #yassa-verif .kuning{background:#fef3c7;color:#92400e} #yassa-verif .abu{background:#f1f5f9;color:#475569} #yassa-verif table{width:100%;border-collapse:collapse;font-size:14px;margin:0} #yassa-verif th{text-align:left;color:#64748b;font-weight:600;padding:8px 10px 8px 0;width:38%;vertical-align:top;border:0} #yassa-verif td{padding:8px 0;font-weight:700;border:0;border-bottom:1px solid #f1f5f9} #yassa-verif tr:last-child td{border-bottom:0} #yassa-verif form{display:flex;gap:8px;margin:18px 0 0} #yassa-verif input{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;text-transform:uppercase;letter-spacing:1px} #yassa-verif button{padding:11px 16px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:14px;cursor:pointer} #yassa-verif .cat{font-size:11px;color:#94a3b8;margin-top:14px;line-height:1.45} </style><div class="kartu"><h2>Verifikasi Dokumen</h2><div class="sub">Yayasan Salam Satu Aspal</div><div id="yv-hasil"></div><form id="yv-form" method="get"><input id="yv-kode" name="kode" placeholder="Kode verifikasi" maxlength="12" autocomplete="off"><button type="submit">Periksa</button></form><div class="cat">Halaman ini hanya menampilkan ringkasan angka. Data pribadi keluarga atau anak tidak ditampilkan.</div></div></div><script> (function () { var API = "https://script.google.com/macros/s/AKfycbzAcz0lUypjUnzSIdpmsyg6KZNYQ3OATwnRNZchR7ukFo9-qZMlh3Wr8Tz8nQr0qUj2/exec"; var hasil = document.getElementById("yv-hasil"); var input = document.getElementById("yv-kode"); function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; } function rupiah(n) { return "Rp " + String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, "."); } function badge(kelas, judul, ket) { hasil.innerHTML = '<div class="badge ' + kelas + '">' + judul + (ket ? "<small>" + ket + "</small>" : "") + "</div>"; } var kode = (new URLSearchParams(window.location.search).get("kode") || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); input.value = kode; if (!kode) { badge("abu", "Masukkan kode verifikasi yang tertera di kaki dokumen."); return; } badge("abu", "Memeriksa dokumen..."); fetch(API + "?action=verifyLaporanJson&kode=" + encodeURIComponent(kode)) .then(function (r) { return r.json(); }) .then(function (j) { if (j.status === "ok") { var d = j.data, baris = [ ["Nomor Dokumen", d.noDok], ["Jenis Laporan", d.jenis], ["Periode", d.periode], ["Wilayah", d.wilayah], ["Program", d.program], ["Jumlah KK", d.kk], ["Jumlah Anak", d.anak], ["Total Nominal", rupiah(d.nominal)], ["Dicetak Oleh", d.pencetak], ["Waktu Cetak", d.waktu + " WIB"] ]; badge("hijau", "&#9989; DOKUMEN TERDAFTAR", "Cocokkan angka di bawah dengan yang tercetak di kertas. Jika ada yang berbeda, dokumen telah diubah setelah dicetak."); hasil.innerHTML += "<table>" + baris.map(function (b) { return "<tr><th>" + esc(b[0]) + "</th><td>" + esc(b[1]) + "</td></tr>"; }).join("") + "</table>"; } else if (j.status === "tidak_ditemukan") { badge("merah", "&#10060; KODE TIDAK DITEMUKAN", "Dokumen ini tidak terdaftar di sistem YASSA, atau kodenya salah ketik. Jangan percayai dokumen ini sebelum dikonfirmasi pengurus pusat."); } else if (j.status === "tidak_konsisten") { badge("kuning", "&#9888;&#65039; DATA REGISTRI TIDAK KONSISTEN", "Catatan untuk kode ini pernah diubah di luar sistem. Hubungi pengurus pusat YASSA sebelum mempercayai dokumen ini."); } else { badge("kuning", "Gagal memeriksa saat ini.", "Coba lagi beberapa saat."); } }) .catch(function () { badge("kuning", "Gagal terhubung ke server.", "Periksa koneksi internet Anda lalu coba lagi."); }); })(); </script>
</body></html>
